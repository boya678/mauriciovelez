<div class="contactos-page">
  <div class="page-header">
    <h2><span class="material-icons">contacts</span> Contactos</h2>
    <div class="header-actions">
      <input
        class="search-input"
        type="text"
        placeholder="Buscar por teléfono o tag…"
        [(ngModel)]="search"
        (keydown.enter)="load()"
      />
      <button class="btn btn-secondary" (click)="load()">
        <span class="material-icons">search</span> Buscar
      </button>
      <button class="btn btn-primary" (click)="exportExcel()" [disabled]="exporting()">
        <span class="material-icons">download</span> {{ exporting() ? 'Exportando…' : 'Exportar Excel' }}
      </button>
    </div>
  </div>

  @if (loading()) {
    <div class="loading">Cargando…</div>
  } @else {
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Teléfono</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody>
          @for (c of contacts(); track c.phone) {
            <tr>
              <td class="phone-cell">{{ c.phone }}</td>
              <td class="tags-cell">
                @for (tag of c.tags.split(','); track tag) {
                  @if (tag.trim()) {
                    <span class="tag-chip">{{ tag.trim() }}</span>
                  }
                }
              </td>
            </tr>
          } @empty {
            <tr><td colspan="2" class="empty">Sin resultados</td></tr>
          }
        </tbody>
      </table>
    </div>
    <div class="count">{{ contacts().length }} contactos</div>
  }
</div>
